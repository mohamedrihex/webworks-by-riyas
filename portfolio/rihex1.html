    <style>
    /* Tools Section */
    .tools-section {
      background: linear-gradient(90deg,rgba(8, 0, 0, 1) 0%, rgba(43, 43, 43, 1) 50%, rgba(8, 0, 0, 1) 100%);
      padding: 5rem 0;
      overflow: hidden;
      text-align: center;
      background-size: no reapet
  background-position: center;
    }
    
    .tools-title h2 {
      color: orange;
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
    }
    
    /* Marquee effect */
    .tools-marquee {
      overflow: hidden;
      position: relative;
    }
    
    .tools-track {
      display: inline-block;
      white-space: nowrap;
      animation: scroll 15s linear infinite;
    }
    
    .tools-track img {
  height: 70px;
  margin: 0 2rem;
  transition: transform 0.5s ease;
  transform-style: preserve-3d;
}

    /* Scroll Animation */
    @keyframes slideIn {
  0% { transform: translateX(-100px); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}

.tools-track img {
  height: 70px;
  margin: 0 2rem;
  filter: grayscale(100%);
  transition: filter 0.3s ease, transform 0.3s ease;
}

.tools-track img:hover {
  filter: grayscale(0%);
  transform: scale(1.1);
}



    </style>
